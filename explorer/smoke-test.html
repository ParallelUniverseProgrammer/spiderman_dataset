<!doctype html><html><body>
<iframe id="f" src="index.html" style="width:1300px;height:900px"></iframe>
<pre id="out"></pre>
<script>
const out = [];
const log = (m) => out.push(m);
const errs = [];
window.addEventListener("error", (e) => errs.push("TOP " + e.message));
const f = document.getElementById("f");
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

f.onload = async () => {
 try {
  const w = f.contentWindow, d = f.contentDocument;
  w.addEventListener("error", (e) => errs.push("IFRAME " + e.message + " @" + e.filename + ":" + e.lineno));
  const q = (s) => d.querySelector(s);
  const qa = (s) => [...d.querySelectorAll(s)];
  const nav = async (h) => { w.location.hash = h; await wait(160); };
  const check = (name, cond, extra) => log((cond ? "PASS " : "FAIL ") + name + (extra ? " :: " + extra : ""));

  await wait(300);
  check("overview charts", qa("figure.chart").length === 4, qa("figure.chart").length);
  check("hero figure", q(".hero-fig .value")?.textContent === "81");

  // table toggle on every chart
  for (const fig of qa("figure.chart")) {
    const btn = fig.querySelector(".toggle");
    btn.click(); await wait(30);
    const ok = !!fig.querySelector("table");
    btn.click(); await wait(30);
    check("table toggle " + fig.querySelector("h2").textContent.slice(0, 18), ok && !fig.querySelector("table"));
  }

  // click a year in the timeline -> works filtered
  const bar = qa("figure.chart")[0].querySelectorAll("rect[role=button]");
  let clicked = null;
  for (const b of bar) { if (b.getAttribute("aria-label")?.startsWith("2018")) { clicked = b; break; } }
  clicked.dispatchEvent(new w.MouseEvent("click", { bubbles: true }));
  await wait(200);
  check("year drill-down", d.querySelector("h1").textContent === "Works" && q(".result-count").textContent.startsWith("4 of"), q(".result-count")?.textContent);

  qa("nav.tabs a").find((a) => a.getAttribute("href") === "#/works").click(); await wait(200);
  const total = qa("tbody tr").length;
  check("works rows", total === 81, total);
  // sort by gross desc
  const heads = qa("thead th");
  const grossTh = heads.find((h) => h.textContent.startsWith("Gross"));
  grossTh.click(); await wait(120);
  check("sort by gross", qa("tbody tr")[0].children[0].textContent.startsWith("Spider-Man: No Way Home"), qa("tbody tr")[0].children[0].textContent);
  // filter chip
  qa(".chips button").find((b) => b.textContent.startsWith("Games")).click(); await wait(120);
  check("filter games", qa("tbody tr").length === 43, qa("tbody tr").length);
  // text filter
  const inp = q('.filters input[type="search"]');
  inp.value = "venom"; inp.dispatchEvent(new w.Event("input", { bubbles: true })); await wait(150);
  check("text filter", qa("tbody tr").length > 0 && qa("tbody tr").length < 10, qa("tbody tr").length);

  await nav("#/work/13");
  check("work detail title", d.querySelector("h1").textContent === "Spider-Man: No Way Home");
  check("work detail sections", qa("section.block").length >= 8, qa("section.block").length);
  // follow a character chip
  q("section.block .chip").click(); await wait(180);
  check("chip -> character", w.location.hash.startsWith("#/character/"), w.location.hash);

  await nav("#/characters");
  check("character rows", qa("tbody tr").length === 264, qa("tbody tr").length);
  const bars = qa(".bar-cell .fill");
  check("bar fills have height", bars.length && bars[0].getBoundingClientRect().height > 3, bars[0]?.getBoundingClientRect().height);
  qa(".chips button").find((b) => b.textContent.startsWith("Villain")).click(); await wait(120);
  check("filter villains", qa("tbody tr").length === 113, qa("tbody tr").length);

  await nav("#/character/27");
  check("character detail", d.querySelector("h1").textContent.includes("Peter Parker"));
  check("appearances table", qa("tbody tr").length >= 60, qa("tbody tr").length);
  check("variants listed", qa("section.block")[1].querySelectorAll(".chip").length > 5);

  await nav("#/people");
  check("people rows", qa("tbody tr").length === 581, qa("tbody tr").length);
  await nav("#/person/35");
  check("person detail", !!d.querySelector("h1").textContent);
  check("person credits", qa("tbody tr").length > 0);

  await nav("#/about");
  check("about sections", qa("section.block").length === 7, qa("section.block").length);

  // global search
  await nav("#/overview");
  const search = d.getElementById("search");
  search.value = "octopus"; search.dispatchEvent(new w.Event("input", { bubbles: true })); await wait(120);
  const hits = qa("#results button");
  check("search finds Doctor Octopus", hits.some((b) => b.textContent.includes("Doctor Octopus")), hits.length + " hits");
  hits[0].click(); await wait(180);
  check("search navigates", w.location.hash !== "#/overview", w.location.hash);

  // sticky header not overlapping first row
  await nav("#/characters");
  const th = q("thead th").getBoundingClientRect();
  const tr = qa("tbody tr")[0].getBoundingClientRect();
  check("header above first row", th.bottom <= tr.top + 1, th.bottom + " vs " + tr.top);

  // no horizontal page overflow
  check("no page h-overflow", d.documentElement.scrollWidth <= d.documentElement.clientWidth + 1,
        d.documentElement.scrollWidth + " vs " + d.documentElement.clientWidth);

  // ---- dimensions added in the deep-dive pass ----
  await nav("#/franchises");
  check("franchise rows", qa("tbody tr").length === 13, qa("tbody tr").length);
  check("franchise chart", qa("figure.chart").length === 1, qa("figure.chart").length);
  qa("tbody .row-link")[0].click(); await wait(200);
  check("franchise detail", w.location.hash.startsWith("#/franchise/"), w.location.hash);
  check("franchise has strip + works", qa("figure.chart").length >= 1 && qa("tbody tr").length > 0);

  await nav("#/studios");
  check("studio rows", qa("tbody tr").length === 104, qa("tbody tr").length);
  await nav("#/studio/" + encodeURIComponent("Columbia Pictures"));
  check("studio detail", d.querySelector("h1").textContent === "Columbia Pictures");
  check("studio works listed", qa("tbody tr").length > 3, qa("tbody tr").length);

  await nav("#/platforms");
  check("platform rows", qa("tbody tr").length === 66, qa("tbody tr").length);
  await nav("#/platform/" + encodeURIComponent("PlayStation 2"));
  check("platform detail", d.querySelector("h1").textContent === "PlayStation 2");
  check("platform releases", qa("tbody tr").length > 2, qa("tbody tr").length);

  await nav("#/analysis");
  check("analysis charts", qa("figure.chart").length === 4, qa("figure.chart").length);
  check("analysis tables", qa("section.block").length === 2, qa("section.block").length);
  for (const fig of qa("figure.chart")) {
    const btn = fig.querySelector(".toggle");
    btn.click(); await wait(30);
    const ok = !!fig.querySelector("table");
    btn.click(); await wait(30);
    check("analysis table view " + fig.querySelector("h2").textContent.slice(0, 16), ok);
  }

  // deepened detail pages
  await nav("#/work/22");
  check("weekly gross chart", qa("figure.chart").length === 1, qa("figure.chart").length);
  await nav("#/work/9");
  check("work has budget table", [...qa("section.block h2")].some((h) => h.textContent.startsWith("Reported budgets")));
  await nav("#/character/27");
  check("character strip + co-appearances", qa("figure.chart").length === 2, qa("figure.chart").length);
  await nav("#/person/35");
  check("person career strip", qa("figure.chart").length >= 1, qa("figure.chart").length);

  // URL-backed filters are shareable and reset from the nav tab
  await nav("#/works?type=game&q=venom");
  const filtered = qa("tbody tr").length;
  check("filters restored from URL", filtered > 0 && filtered < 10, filtered);
  qa("nav.tabs a").find((a) => a.getAttribute("href") === "#/works").click(); await wait(200);
  check("nav tab clears filters", qa("tbody tr").length === 81, qa("tbody tr").length);

  // sorting writes itself into the URL
  qa("thead th").find((h) => h.textContent.startsWith("Gross")).click(); await wait(150);
  check("sort is in the URL", w.location.hash.includes("sort=gross"), w.location.hash);

  // CSV export reflects what is on screen
  const csvBtn = [...qa(".filters .toggle")].find((b) => b.textContent === "Download CSV");
  check("csv button present", !!csvBtn);
  const rowsNow = qa("tbody tr").length;
  const csv = w.csvFromTable(d.querySelector("tbody").parentNode);
  check("csv row count", csv.split("\n").length === rowsNow + 1, csv.split("\n").length + " vs " + (rowsNow + 1));
  check("csv escapes commas", csv.split("\n")[1].split(",").length >= 9);

  // search reaches the new dimensions
  await nav("#/overview");
  const s2 = d.getElementById("search");
  s2.value = "insomniac"; s2.dispatchEvent(new w.Event("input", { bubbles: true })); await wait(150);
  check("search finds a studio", [...qa("#results button")].some((b) => b.textContent.includes("Insomniac")), qa("#results button").length + " hits");

  await nav("#/overview");
  check("overview tiles link to dimensions", qa('.kpi[href="#/platforms"]').length === 1);

  log(errs.length ? "FAIL js-errors :: " + errs.join(" | ") : "PASS no-js-errors");
 } catch (e) {
  log("FAIL harness-threw :: " + (e && e.stack ? e.stack.split("\n").slice(0, 3).join(" / ") : e));
 }
 document.getElementById("out").textContent = out.join("\n");
 document.title = "DONE " + out.filter((l) => l.startsWith("FAIL")).length + " failures";
};
</script>
</body></html>
