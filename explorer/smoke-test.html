<!doctype html><html><head><meta charset="utf-8"></head><body>
<iframe id="f" src="index.html" style="width:1300px;height:900px"></iframe>
<pre id="out"></pre>
<script>
const out = [];
// Written out as we go, so a run cut short still shows how far it got.
const log = (m) => { out.push(m); document.getElementById("out").textContent = out.join("\n"); };
const errs = [];
window.addEventListener("error", (e) => errs.push("TOP " + e.message));
const f = document.getElementById("f");
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

f.onload = async () => {
 try {
  const w = f.contentWindow, d = f.contentDocument;
  w.addEventListener("error", (e) => errs.push("IFRAME " + e.message + " @" + e.filename + ":" + e.lineno));
  const q = (s) => d.querySelector(s);
  const qa = (s) => [...d.querySelectorAll(s)];
  const nav = async (h) => { w.location.hash = h; await wait(160); };
  const check = (name, cond, extra) => log((cond ? "PASS " : "FAIL ") + name + (extra ? " :: " + extra : ""));

  await wait(300);
  check("overview charts", qa("figure.chart").length === 4, qa("figure.chart").length);
  check("hero figure", q(".hero-fig .value")?.textContent === "81");

  // table toggle on every chart
  for (const fig of qa("figure.chart")) {
    const btn = fig.querySelector(".toggle");
    btn.click(); await wait(30);
    const ok = !!fig.querySelector("table");
    btn.click(); await wait(30);
    check("table toggle " + fig.querySelector("h2").textContent.slice(0, 18), ok && !fig.querySelector("table"));
  }

  // click a year in the timeline -> works filtered
  const bar = qa("figure.chart")[0].querySelectorAll("rect[role=button]");
  let clicked = null;
  for (const b of bar) { if (b.getAttribute("aria-label")?.startsWith("2018")) { clicked = b; break; } }
  clicked.dispatchEvent(new w.MouseEvent("click", { bubbles: true }));
  await wait(200);
  check("year drill-down", w.location.hash === "#/year/2018" && d.querySelector("h1").textContent === "2018", w.location.hash);

  qa("nav.tabs a").find((a) => a.getAttribute("href") === "#/works").click(); await wait(200);
  const total = qa("tbody tr").length;
  check("works rows", total === 81, total);
  // sort by gross desc
  const heads = qa("thead th");
  const grossTh = heads.find((h) => h.textContent.startsWith("Gross"));
  grossTh.click(); await wait(120);
  check("sort by gross", qa("tbody tr")[0].children[0].textContent.startsWith("Spider-Man: No Way Home"), qa("tbody tr")[0].children[0].textContent);
  // filter chip
  qa(".chips button").find((b) => b.textContent.startsWith("Games")).click(); await wait(120);
  check("filter games", qa("tbody tr").length === 43, qa("tbody tr").length);
  // text filter
  const inp = q('.filters input[type="search"]');
  inp.value = "venom"; inp.dispatchEvent(new w.Event("input", { bubbles: true })); await wait(150);
  check("text filter", qa("tbody tr").length > 0 && qa("tbody tr").length < 10, qa("tbody tr").length);

  await nav("#/work/13");
  check("work detail title", d.querySelector("h1").textContent === "Spider-Man: No Way Home");
  check("work detail sections", qa("section.block").length >= 8, qa("section.block").length);
  // follow a character chip
  q("section.block .chip").click(); await wait(180);
  check("chip -> character", w.location.hash.startsWith("#/character/"), w.location.hash);

  await nav("#/characters");
  check("character rows", qa("tbody tr").length === 264, qa("tbody tr").length);
  const bars = qa(".bar-cell .fill");
  check("bar fills have height", bars.length && bars[0].getBoundingClientRect().height > 3, bars[0]?.getBoundingClientRect().height);
  qa(".chips button").find((b) => b.textContent.startsWith("Villain")).click(); await wait(120);
  check("filter villains", qa("tbody tr").length === 113, qa("tbody tr").length);

  await nav("#/character/27");
  check("character detail", d.querySelector("h1").textContent.includes("Peter Parker"));
  check("appearances table", qa("tbody tr").length >= 60, qa("tbody tr").length);
  const variantsSection = qa("section.block").find((s) => s.querySelector("h2").textContent.startsWith("Credit spellings collapsed"));
  check("variants listed", !!variantsSection && variantsSection.querySelectorAll(".chip").length > 5);

  await nav("#/people");
  check("people rows", qa("tbody tr").length === 581, qa("tbody tr").length);
  await nav("#/person/35");
  check("person detail", !!d.querySelector("h1").textContent);
  check("person credits", qa("tbody tr").length > 0);

  await nav("#/about");
  check("about sections", qa("section.block").length === 7, qa("section.block").length);

  // global search
  await nav("#/overview");
  const search = d.getElementById("search");
  search.value = "octopus"; search.dispatchEvent(new w.Event("input", { bubbles: true })); await wait(120);
  const hits = qa("#results button");
  check("search finds Doctor Octopus", hits.some((b) => b.textContent.includes("Doctor Octopus")), hits.length + " hits");
  hits[0].click(); await wait(180);
  check("search navigates", w.location.hash !== "#/overview", w.location.hash);

  // sticky header not overlapping first row
  await nav("#/characters");
  const th = q("thead th").getBoundingClientRect();
  const tr = qa("tbody tr")[0].getBoundingClientRect();
  check("header above first row", th.bottom <= tr.top + 1, th.bottom + " vs " + tr.top);

  // no horizontal page overflow
  check("no page h-overflow", d.documentElement.scrollWidth <= d.documentElement.clientWidth + 1,
        d.documentElement.scrollWidth + " vs " + d.documentElement.clientWidth);

  // ---- dimensions added in the deep-dive pass ----
  await nav("#/franchises");
  check("franchise rows", qa("tbody tr").length === 13, qa("tbody tr").length);
  check("franchise chart", qa("figure.chart").length === 1, qa("figure.chart").length);
  qa("tbody .row-link")[0].click(); await wait(200);
  check("franchise detail", w.location.hash.startsWith("#/franchise/"), w.location.hash);
  check("franchise has strip + works", qa("figure.chart").length >= 1 && qa("tbody tr").length > 0);

  await nav("#/studios");
  check("studio rows", qa("tbody tr").length === 104, qa("tbody tr").length);
  await nav("#/studio/" + encodeURIComponent("Columbia Pictures"));
  check("studio detail", d.querySelector("h1").textContent === "Columbia Pictures");
  check("studio works listed", qa("tbody tr").length > 3, qa("tbody tr").length);

  await nav("#/platforms");
  check("platform rows", qa("tbody tr").length === 66, qa("tbody tr").length);
  await nav("#/platform/" + encodeURIComponent("PlayStation 2"));
  check("platform detail", d.querySelector("h1").textContent === "PlayStation 2");
  check("platform releases", qa("tbody tr").length > 2, qa("tbody tr").length);

  await nav("#/analysis");
  check("analysis charts", qa("figure.chart").length === 4, qa("figure.chart").length);
  check("analysis tables", qa("section.block").length === 3, qa("section.block").length);
  for (const fig of qa("figure.chart")) {
    const btn = fig.querySelector(".toggle");
    btn.click(); await wait(30);
    const ok = !!fig.querySelector("table");
    btn.click(); await wait(30);
    check("analysis table view " + fig.querySelector("h2").textContent.slice(0, 16), ok);
  }

  // deepened detail pages
  await nav("#/work/22");
  check("weekly gross chart", qa("figure.chart").length === 1, qa("figure.chart").length);
  await nav("#/work/9");
  check("work has budget table", [...qa("section.block h2")].some((h) => h.textContent.startsWith("Reported budgets")));
  await nav("#/character/27");
  check("character strip + co-appearances", qa("figure.chart").length === 2, qa("figure.chart").length);
  await nav("#/person/35");
  check("person career strip", qa("figure.chart").length >= 1, qa("figure.chart").length);

  // URL-backed filters are shareable and reset from the nav tab
  await nav("#/works?type=game&q=venom");
  const filtered = qa("tbody tr").length;
  check("filters restored from URL", filtered > 0 && filtered < 10, filtered);
  qa("nav.tabs a").find((a) => a.getAttribute("href") === "#/works").click(); await wait(200);
  check("nav tab clears filters", qa("tbody tr").length === 81, qa("tbody tr").length);

  // sorting writes itself into the URL
  qa("thead th").find((h) => h.textContent.startsWith("Gross")).click(); await wait(150);
  check("sort is in the URL", w.location.hash.includes("sort=gross"), w.location.hash);

  // CSV export reflects what is on screen
  const csvBtn = [...qa(".filters .toggle")].find((b) => b.textContent === "Download CSV");
  check("csv button present", !!csvBtn);
  const rowsNow = qa("tbody tr").length;
  const csv = w.csvFromTable(d.querySelector("tbody").parentNode);
  check("csv row count", csv.split("\n").length === rowsNow + 1, csv.split("\n").length + " vs " + (rowsNow + 1));
  check("csv escapes commas", csv.split("\n")[1].split(",").length >= 9);

  // search reaches the new dimensions
  await nav("#/overview");
  const s2 = d.getElementById("search");
  s2.value = "insomniac"; s2.dispatchEvent(new w.Event("input", { bubbles: true })); await wait(150);
  check("search finds a studio", [...qa("#results button")].some((b) => b.textContent.includes("Insomniac")), qa("#results button").length + " hits");

  await nav("#/overview");
  check("overview tiles link to dimensions", qa('.kpi[href="#/platforms"]').length === 1);

  // Nothing should open a new browsing context except a genuine outbound link (IMDb,
  // Wikipedia, …) — every internal hash route stays in this tab.
  const offenders = [];
  for (const h of ["#/overview", "#/works", "#/work/13", "#/person/35", "#/character/27",
                   "#/franchise/MCU", "#/studios", "#/platforms", "#/analysis", "#/about"]) {
    await nav(h);
    for (const a of qa("a[target]")) if (!/^https?:\/\//.test(a.getAttribute("href") || "")) offenders.push(h + " " + a.textContent.trim());
  }
  check("no internal link opens a new tab", offenders.length === 0, offenders.join(", "));

  // Header links must not perform a real navigation — the viewer would spawn a tab.
  await nav("#/overview");
  const navA = qa("nav.tabs a").find((a) => a.getAttribute("href") === "#/studios");
  const ev = new w.MouseEvent("click", { bubbles: true, cancelable: true });
  navA.dispatchEvent(ev);
  await wait(200);
  check("header link default is prevented", ev.defaultPrevented);
  check("header link still navigates", w.location.hash === "#/studios", w.location.hash);

  const brand = q("a.brand");
  const ev2 = new w.MouseEvent("click", { bubbles: true, cancelable: true });
  brand.dispatchEvent(ev2);
  await wait(200);
  check("brand link handled in page", ev2.defaultPrevented && w.location.hash === "#/overview", w.location.hash);

  const tile = q('.kpi[href="#/platforms"]');
  const ev3 = new w.MouseEvent("click", { bubbles: true, cancelable: true });
  tile.dispatchEvent(ev3);
  await wait(200);
  check("overview tile handled in page", ev3.defaultPrevented && w.location.hash === "#/platforms", w.location.hash);

  // A ctrl-click is still the user asking for a new tab, so leave it to the browser.
  await nav("#/overview");
  const ev4 = new w.MouseEvent("click", { bubbles: true, cancelable: true, ctrlKey: true });
  qa("nav.tabs a").find((a) => a.getAttribute("href") === "#/works").dispatchEvent(ev4);
  await wait(120);
  check("modified click left to the browser", !ev4.defaultPrevented);

  // ---- cross-links: the dimensions that only exist as columns in the source ----
  const sectionTitles = () => qa("section.block h2").map((h) => h.textContent.replace(/\d+$/, "").trim());

  await nav("#/publications");
  check("outlet rows", qa("tbody tr").length === 59, qa("tbody tr").length);
  qa("tbody .row-link")[0].click(); await wait(200);
  check("outlet detail", w.location.hash.startsWith("#/publication/") && sectionTitles().includes("Scores"), w.location.hash);

  await nav("#/comics");
  check("comic rows", qa("tbody tr").length > 40, qa("tbody tr").length);
  await nav("#/comic/" + encodeURIComponent("The Amazing Spider-Man"));
  check("comic detail", sectionTitles().includes("Adapted by"), sectionTitles().join("|"));

  await nav("#/awards");
  check("award body rows", qa("tbody tr").length === 24, qa("tbody tr").length);
  await nav("#/award/" + encodeURIComponent("Academy Awards"));
  check("award detail", d.querySelector("h1").textContent === "Academy Awards" && qa("tbody tbody, tbody")[0].querySelectorAll("tr").length === 9, qa("tbody")[0].querySelectorAll("tr").length);

  await nav("#/roles");
  check("role rows", qa("tbody tr").length === 62, qa("tbody tr").length);
  await nav("#/role/actor");
  check("role detail", d.querySelector("h1").textContent === "actor" && qa("figure.chart").length === 1, qa("figure.chart").length);

  // ---- a year, an attribute and the lookup of last resort ----
  await nav("#/year/2002");
  check("year page", d.querySelector("h1").textContent === "2002" && qa("tbody tr").length > 0, qa("tbody tr").length);
  check("year page cross-sections", sectionTitles().some((t) => t.startsWith("Released this year")), sectionTitles().join("|"));

  await nav("#/facet/rating/PG-13");
  check("facet page", qa("tbody tr").length === 13, qa("tbody tr").length);
  check("facet siblings", sectionTitles().some((t) => t.startsWith("Other mpaa")) || qa(".chip").length > 0);

  await nav("#/find/" + encodeURIComponent("Stan Lee"));
  check("find page", qa("section.block").length >= 2 && qa(".chip").length > 2, qa("section.block").length + " groups");
  await nav("#/find/" + encodeURIComponent("zzzznotathing"));
  check("find page empty state", !!q(".empty-state"));

  // ---- the person -> character -> performer loop the whole thing hangs on ----
  await nav("#/person/35");
  const played = qa("section.block").find((s) => s.querySelector("h2").textContent.startsWith("Characters played"));
  check("person lists characters played", !!played);
  check("characters played carries dates", played && /\d{4}/.test(played.querySelector("tbody tr").textContent), played?.querySelector("tbody tr")?.textContent.slice(0, 60));
  played.querySelector("tbody .row-link").click(); await wait(200);
  check("character reached from person", w.location.hash.startsWith("#/character/"), w.location.hash);
  const playedBy = qa("section.block").find((s) => s.querySelector("h2").textContent.startsWith("Played by"));
  check("character lists its performers", !!playedBy);
  playedBy.querySelector("tbody .row-link").click(); await wait(200);
  check("person reached from character", w.location.hash.startsWith("#/person/"), w.location.hash);

  // ---- overlap sections, and ranked-list drill-down with a focused row ----
  await nav("#/work/13");
  check("work overlaps section", sectionTitles().some((t) => t.startsWith("Overlaps with")), sectionTitles().join("|"));
  const grossTile = qa(".kpi").find((k) => k.textContent.includes("Worldwide gross"));
  check("gross tile links to the ranking", grossTile?.getAttribute("href")?.includes("focus=13"), grossTile?.getAttribute("href"));
  grossTile.dispatchEvent(new w.MouseEvent("click", { bubbles: true, cancelable: true })); await wait(250);
  check("focused row highlighted", qa("tr.row-focus").length === 1 && q("tr.row-focus").textContent.includes("No Way Home"), qa("tr.row-focus").length);

  // ---- free-text names resolve to people, studios or the lookup ----
  await nav("#/work/9");
  const deflist = qa(".deflist .v");
  check("every fact is a link", deflist.length > 0 && deflist.every((v) => v.querySelector("button, a")), deflist.filter((v) => !v.querySelector("button, a")).map((v) => v.textContent).join(" | "));
  await nav("#/work/40");
  const relTable = qa("section.block").find((s) => s.querySelector("h2").textContent.startsWith("Releases"));
  check("release rows link out", relTable.querySelectorAll("tbody tr td button").length >= relTable.querySelectorAll("tbody tr").length);

  // ---- the promise: no cell of data is a dead end ----
  // Text that is a measurement, a verdict or a placeholder is allowed to be inert; anything
  // that names a thing has to be clickable.
  const INERT = /^(—|–|Won|Nominated|yes|no|n\/a|score|song|[+\-–]?[\d.,]+(\s*(min|M|K|×|yrs|\/\s*[\d.,]+|out of \d+))?|\$[\d.,]+[KMB]?|\d{4}\s*[–-]\s*\d{4}|\d+\s*\/\s*\d+)$/i;
  const dead = [];
  for (const h of ["#/works", "#/characters", "#/people", "#/work/13", "#/work/28", "#/work/40",
                   "#/character/27", "#/person/35", "#/franchise/MCU", "#/studio/" + encodeURIComponent("Columbia Pictures"),
                   "#/platform/" + encodeURIComponent("PlayStation 2"), "#/publication/IGN", "#/award/Academy%20Awards",
                   "#/role/composer", "#/year/2002", "#/facet/rating/PG-13", "#/analysis"]) {
    await nav(h);
    for (const td of qa("td, .deflist .v")) {
      const t = td.textContent.trim().replace(/\s+/g, " ");
      if (!t || INERT.test(t)) continue;
      if (td.querySelector("button, a, .chip")) continue;
      dead.push(h + " :: " + t.slice(0, 40));
    }
  }
  check("no cell of data is a dead end", dead.length === 0, dead.slice(0, 12).join(" | ") + (dead.length > 12 ? ` (+${dead.length - 12})` : ""));

  // The new pages must not push the page sideways either.
  const wide = [];
  for (const h of ["#/publications", "#/comics", "#/roles", "#/publication/IGN", "#/comic/" + encodeURIComponent("The Amazing Spider-Man"),
                   "#/role/actor", "#/year/2002", "#/facet/rating/PG-13", "#/find/" + encodeURIComponent("Stan Lee"), "#/person/35", "#/character/27"]) {
    await nav(h);
    if (d.documentElement.scrollWidth > d.documentElement.clientWidth + 1) wide.push(h + " " + d.documentElement.scrollWidth);
  }
  check("no h-overflow on the new pages", wide.length === 0, wide.join(", "));

  // Follow the links rather than trusting them: every value-level link has to land on a
  // real page, not an "Unknown …" stub.
  const broken = [];
  for (const page of ["#/work/40", "#/work/28", "#/person/35", "#/character/27", "#/year/2002"]) {
    await nav(page);
    const n = Math.min(qa(".row-link.soft").length, 14);
    for (let i = 0; i < n; i++) {
      await nav(page);
      const link = qa(".row-link.soft")[i];
      const label = link.textContent.trim().slice(0, 24);
      link.click(); await wait(140);
      const landed = q("h1") && !q(".empty-state");
      if (!landed) broken.push(page + " → " + label + " → " + w.location.hash);
    }
  }
  check("every value link lands somewhere real", broken.length === 0, broken.slice(0, 6).join(" | "));

  // ---- a link has to answer the number it sits on ----
  // A tile counting "2 movies for this character" must land on those two movies, not on
  // every movie in the catalogue.
  await nav("#/character/10");
  const docOck = qa(".kpi").find((k) => k.textContent.includes("Movies"));
  check("character medium tile is scoped", docOck?.getAttribute("href")?.includes("char=10"), docOck?.getAttribute("href"));
  const tileN = Number(docOck.querySelector(".value").textContent);
  docOck.dispatchEvent(new w.MouseEvent("click", { bubbles: true, cancelable: true })); await wait(220);
  check("scoped tile lands on exactly that many works", qa("tbody tr").length === tileN, qa("tbody tr").length + " vs " + tileN);

  await nav("#/works?type=movie&char=10");
  check("character filter restores from the URL", qa("tbody tr").length === tileN, qa("tbody tr").length);
  check("character filter is visible in the filter bar", [...qa(".filters select option")].some((o) => o.selected && o.textContent === "Doctor Octopus"));
  qa("nav.tabs a").find((a) => a.getAttribute("href") === "#/works").click(); await wait(200);
  check("nav tab clears the character filter", qa("tbody tr").length === 81, qa("tbody tr").length);

  // Every "?at=" destination has to exist on the page it opens.
  const missing = [];
  for (const page of ["#/year/2002", "#/year/2018", "#/character/10", "#/work/13", "#/work/9",
                      "#/comic/" + encodeURIComponent("The Amazing Spider-Man")]) {
    await nav(page);
    const jumps = qa(".kpi[href*='?at=']").map((k) => k.getAttribute("href"));
    for (const h of jumps) {
      await nav(h);
      const id = new URLSearchParams(h.split("?")[1]).get("at");
      if (!d.getElementById(id)) missing.push(page + " → " + h);
    }
  }
  check("every jump tile finds its block", missing.length === 0, missing.join(" | "));

  // A chip's count is a promise about what clicking it gives you.
  await nav("#/works?char=10");
  const chipN = Number(qa(".chips button").find((b) => b.textContent.startsWith("Games")).textContent.match(/\d+/)[0]);
  qa(".chips button").find((b) => b.textContent.startsWith("Games")).click(); await wait(160);
  check("chip counts hold inside the other filters", qa("tbody tr").length === chipN, qa("tbody tr").length + " vs " + chipN);

  await nav("#/characters?q=spider");
  const heroChip = Number(qa(".chips button").find((b) => b.textContent.startsWith("Hero")).textContent.match(/\d+/)[0]);
  qa(".chips button").find((b) => b.textContent.startsWith("Hero")).click(); await wait(160);
  check("character chip counts hold too", qa("tbody tr").length === heroChip, qa("tbody tr").length + " vs " + heroChip);

  // No tile may point at a page that says nothing about the number on it.
  await nav("#/work/13");
  check("budget tile no longer dumps you on Analysis", !qa(".kpi").some((k) => k.getAttribute("href") === "#/analysis"),
        qa(".kpi").filter((k) => k.getAttribute("href") === "#/analysis").map((k) => k.textContent).join(","));

  // ---- no tile anywhere is inert, and none lands on an unfiltered list ----
  const BARE = ["#/works", "#/characters", "#/people", "#/franchises", "#/studios", "#/platforms",
                "#/publications", "#/comics", "#/awards", "#/roles", "#/analysis", "#/about"];
  const inertTiles = [], bareTiles = [];
  const tilePages = ["#/work/13", "#/work/28", "#/work/40", "#/character/27", "#/person/35",
                     "#/franchise/" + encodeURIComponent("Marvel Cinematic Universe"),
                     "#/studio/" + encodeURIComponent("Columbia Pictures"),
                     "#/platform/" + encodeURIComponent("PlayStation 2"),
                     "#/platform/" + encodeURIComponent("Atari 2600"),
                     "#/publication/" + encodeURIComponent("Push Square"),
                     "#/comic/" + encodeURIComponent("The Amazing Spider-Man"),
                     "#/award/" + encodeURIComponent("Academy Awards"),
                     "#/role/actor", "#/facet/rating/PG-13", "#/year/2002"];
  for (const page of tilePages) {
    await nav(page);
    for (const k of qa("#app .kpi")) {
      const what = page + " " + (k.querySelector(".label")?.textContent || "?");
      if (k.tagName !== "A") inertTiles.push(what);
      else if (BARE.includes(k.getAttribute("href"))) bareTiles.push(what + " → " + k.getAttribute("href"));
    }
  }
  check("no tile is inert", inertTiles.length === 0, inertTiles.join(" | "));
  check("no tile dumps you on an unfiltered list", bareTiles.length === 0, bareTiles.join(" | "));

  // A dimension page's medium tile filters that page's own works block.
  await nav("#/studio/" + encodeURIComponent("Columbia Pictures"));
  const movieTile = qa(".kpi").find((k) => k.querySelector(".label")?.textContent === "Movies");
  const movieN = Number(movieTile.querySelector(".value").textContent);
  await nav(movieTile.getAttribute("href"));
  const wb = d.getElementById("works");
  check("studio medium tile filters its own works block", wb && Number(wb.querySelector("h2 .n").textContent) === movieN,
        wb ? wb.querySelector("h2 .n").textContent + " vs " + movieN : "no block");
  check("and the block's chips let you widen back out", wb.querySelectorAll(".section-filters button").length === 3,
        wb.querySelectorAll(".section-filters button").length);
  wb.querySelector(".section-filters button").click(); await wait(160);
  check("widening restores every work", Number(d.getElementById("works").querySelector("h2 .n").textContent) === 23,
        d.getElementById("works").querySelector("h2 .n").textContent);

  // An award page's result tiles cut its own record table.
  await nav("#/award/" + encodeURIComponent("Academy Awards"));
  const wonTile = qa(".kpi").find((k) => k.querySelector(".label")?.textContent === "Won");
  const wonN = Number(wonTile.querySelector(".value").textContent);
  await nav(wonTile.getAttribute("href"));
  check("award 'Won' tile cuts the record table", Number(d.getElementById("records").querySelector("h2 .n").textContent) === wonN,
        d.getElementById("records").querySelector("h2 .n").textContent + " vs " + wonN);

  // Two blocks on one page cut independently, so changing one must not silently reset the
  // other — a tile that jumps to its own block rewrites only its own params.
  await nav("#/award/" + encodeURIComponent("Academy Awards") + "?at=works&type=movie");
  const wonHref = qa(".kpi").find((k) => k.querySelector(".label")?.textContent === "Won").getAttribute("href");
  check("a tile keeps the rest of the page's state",
        wonHref.includes("type=movie") && wonHref.includes("result=won"), wonHref);
  await nav(wonHref);
  check("and still cuts its own block", Number(d.getElementById("records").querySelector("h2 .n").textContent) === 2,
        d.getElementById("records").querySelector("h2 .n").textContent);
  // The "Works" tile means all of them, so it is the one thing that clears the medium cut.
  const allHref = qa(".kpi").find((k) => k.querySelector(".label")?.textContent === "Works").getAttribute("href");
  check("but the Works tile clears the medium cut", !allHref.includes("type="), allHref);

  // A series' Seasons tile lands on an episode guide that shows the seasons.
  await nav("#/work/28");
  const seasonTile = qa(".kpi").find((k) => k.querySelector(".label")?.textContent === "Seasons");
  const seasonN = Number(seasonTile.querySelector(".value").textContent);
  await nav(seasonTile.getAttribute("href"));
  const eb = d.getElementById("episodes");
  check("seasons tile lands on a guide split by season",
        eb && eb.querySelectorAll(".section-filters button").length === seasonN + 1,
        eb ? eb.querySelectorAll(".section-filters button").length : "no block");
  const s1 = eb.querySelectorAll(".section-filters button")[1];
  const s1n = Number(s1.querySelector(".n").textContent);
  s1.click(); await wait(160);
  check("picking a season cuts the guide to it",
        Number(d.getElementById("episodes").querySelector("h2 .n").textContent) === s1n,
        d.getElementById("episodes").querySelector("h2 .n").textContent + " vs " + s1n);

  // A film's runtime ranks against the other films, in a column you can actually see.
  await nav("#/work/13");
  const rtTile = qa(".kpi").find((k) => k.querySelector(".label")?.textContent === "Runtime");
  await nav(rtTile.getAttribute("href"));
  check("runtime tile ranks films by runtime",
        qa("thead th").some((h) => h.textContent.startsWith("Runtime")) && !!q("tr.row-focus"),
        qa("thead th").map((h) => h.textContent).join(","));
  check("and the ranking is films only", qa("tbody tr").length === 23, qa("tbody tr").length);

  // A budget with no gross can't sit on the budget→gross chart, so it ranks instead —
  // and the ranking has to show the figure it ranked on.
  await nav("#/work/22");
  const bTile = qa(".kpi").find((k) => k.querySelector(".label")?.textContent === "Production budget");
  check("budget tile has a destination", !!bTile.getAttribute("href"), bTile.outerHTML.slice(0, 60));
  await nav(bTile.getAttribute("href"));
  check("budget tile ranks by budget, with the column shown",
        qa("thead th").some((h) => h.textContent.startsWith("Budget")) && !!q("tr.row-focus"),
        qa("thead th").map((h) => h.textContent).join(","));
  // The default list must not carry those two columns around.
  await nav("#/works");
  check("neither column clutters the default list",
        !qa("thead th").some((h) => /^(Budget|Runtime)/.test(h.textContent)),
        qa("thead th").map((h) => h.textContent).join(","));

  // An outlet's mean is the mean of what it filed, not of how good the works were.
  await nav("#/publication/" + encodeURIComponent("Push Square"));
  const meanTiles = qa(".kpi").filter((k) => k.querySelector(".label")?.textContent === "Mean score");
  check("outlet mean is not duplicated", meanTiles.length === 1, meanTiles.length);
  const lo = Number(q("#app .meta-line") && qa(".kpi").find((k) => k.querySelector(".label").textContent === "Range").querySelector(".value").textContent.split("–")[0]);
  const hi = Number(qa(".kpi").find((k) => k.querySelector(".label").textContent === "Range").querySelector(".value").textContent.split("–")[1]);
  const mean = Number(meanTiles[0].querySelector(".value").textContent.split(" ")[0]);
  check("outlet mean sits inside the range it filed", mean >= lo && mean <= hi, mean + " in " + lo + "–" + hi);

  log(errs.length ? "FAIL js-errors :: " + errs.join(" | ") : "PASS no-js-errors");
 } catch (e) {
  log("FAIL harness-threw :: " + (e && e.stack ? e.stack.split("\n").slice(0, 3).join(" / ") : e));
 }
 document.getElementById("out").textContent = out.join("\n");
 document.title = "DONE " + out.filter((l) => l.startsWith("FAIL")).length + " failures";
};
</script>
</body></html>
